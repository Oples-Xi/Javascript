
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 4 - Shopping List</title>
</head>
<body>

<h1>Shopping List</h1>

<ul id="shoppingList">
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>
</ul>

<button id="addMilk">Add Milk</button>
<button id="addBread">Add Bread</button>
<button id="removeLast">Remove Last</button>
<button id="countItems">Count Items</button>

<script>
    let shoppingList = document.getElementById("shoppingList");

    // 1. Add Milk to the end
    document.getElementById("addMilk").onclick = function () {
        let milk = document.createElement("li");
        milk.innerText = "Milk";
        shoppingList.appendChild(milk);
    };

    // 2. Add Bread to the beginning
    document.getElementById("addBread").onclick = function () {
        let bread = document.createElement("li");
        bread.innerText = "Bread";
        shoppingList.prepend(bread);
    };

    // 3. Remove the last element
    document.getElementById("removeLast").onclick = function () {
        if (shoppingList.lastElementChild !== null) {
            shoppingList.lastElementChild.remove();
        }
    };

    // 4. Print the number of elements
    document.getElementById("countItems").onclick = function () {
        console.log("Number of items:", shoppingList.children.length);
    };
</script>

</body>
</html>
