<script>
    const correctPassword = "114514";

    let password1 = prompt("Enter password:");
    let password2 = prompt("Enter password again:");

    if (
        password1 === correctPassword && password2 === correctPassword)
    {
        console.log("Access granted.");
    }
    else if (password1 === null || password2 === null || password1 === "" || password2 === "")
    {
        console.log("No password entered.");
    }
    else {
        console.log("Access denied: wrong password.");
    }
</script>
