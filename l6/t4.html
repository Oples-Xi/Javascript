<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
<script>
    let groceryString = "apple, banana, orange, milk, bread";

    // 1. 将字符串转换为数组
    let groceries = groceryString.split(", ");
    console.log("Shopping list:", groceries);

    // 2. 查找 orange 的索引
    let orangeIndex = groceries.indexOf("orange");
    console.log("Index of orange:", orangeIndex);

    // 3. 提取索引 1 到 3 之前的元素
    let selectedItems = groceries.slice(1, 3);
    console.log("Selected items:", selectedItems);

    // 4. 输出结果

</script>
</body>
</html>
