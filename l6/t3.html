<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>l6t3</title>
</head>
<body>
<script>
    let text = "The quick brown fox jumps over the lazy dog";

    let upperText = text.toUpperCase();
    console.log("Uppercase:", upperText);

    let replacedText = text.replace("quick", "slow");
    console.log("Replaced:", replacedText);

    let character = text.charAt(10);
    console.log("Character at index 10:", character);

</script>
</body>
</html>
