<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>l6t1</title>
</head>
<body>
<script>
    let Colors = ["Red", "Green", "Yellow"];

    // 1. 输出数组长度
    console.log("Array length:", Colors.length);

    // 2. 在数组末尾添加 Pink
    Colors.push("Pink");

    // 3. 删除第一个元素，并输出删除的值
    let removedColor = Colors.shift();
    console.log("Removed color:", removedColor);

    // 4. 输出最终数组
    console.log("Final array:", Colors);
</script>
</body>
</html>
