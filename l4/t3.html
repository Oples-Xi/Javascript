<script>
    function Movie(title, director, year) {
        this.title = title;
        this.director = director;
        this.year = year;

        this.getInfo = function () {
            return `Movie: ${this.title}, Director: ${this.director}, Year: ${this.year}`;
        };
    }

    Movie.prototype.setRating = function (rating) {
        this.rating = rating;
    };

    Movie.prototype.getFullInfo = function () {
        return `${this.getInfo()}, Rating: ${this.rating}`;
    };

    let movie1 = new Movie(
        "Harry Potter and the Sorcerer's Stone",

        2001
    );

</script>
