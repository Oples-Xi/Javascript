<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>t2</title>
</head>
<body>

<script>
    let number;

    do 
    {
        number = Number(prompt("Enter a positive integer:"));
    }
    while (Number.isNaN(number) || number <= 0 || !Number.isInteger(number));

    let factorial = 1;
    let i = 1;


    while (i <= number) 
    {
        factorial = factorial * i;
        i++;
    }

    console.log(`The factorial of number ${number} is: ${factorial}`);
</script>

</body>
</html>
